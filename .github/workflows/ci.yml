name: SpeedyBot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile main.py
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n update.sh
      - name: Version file
        run: test -s VERSION.txt
